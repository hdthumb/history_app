<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timeline Atlas</title>
<meta name="theme-color" content="#f8efe2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#231a21" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atlas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..700,0..100&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a fixed top bar, one working view that fills the screen, and a thumb-height tab bar. The timeline is a horizontally scrolling parallel chart, one lane per region. */
:root{
  /* Warm 70s palette: cream paper, burnt orange, soft purple, mustard and rose */
  --bg:#f8efe2; --panel:#fffaf3; --ink:#3b2732; --muted:#8b726c; --line:#ecdcc9; --grid:rgba(59,39,50,.06);
  --accent:#d9682f; --accent-ink:#fffaf3; --plum:#7e5aa8; --plum-ink:#fffaf3; --soft:#f6e4cf; --warn:#b5402a; --mapland:#ead7c0;
  --note:#fdf1d3; --noteb:#c98a22; --noteink:#4a3418;
  --r-eu:#9a5a9f; --r-me:#d4672f; --r-af:#b48a1c; --r-sa:#c94f6b; --r-ca:#6e57aa; --r-ea:#b8462f; --r-se:#3f8a7d; --r-am:#7f7a2c;
  --fd:'Fraunces',Georgia,'Times New Roman',serif; --fu:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --rad:16px; --shadow:0 8px 26px rgba(91,52,34,.14);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#231a21; --panel:#2e232c; --ink:#f7e9dc; --muted:#bea69d; --line:#45343f; --grid:rgba(247,233,220,.07);
    --accent:#f08a4b; --accent-ink:#2a150b; --plum:#b493e0; --plum-ink:#24152f; --soft:#3a2b35; --warn:#ff9a80; --mapland:#4a3a42;
    --note:#3a2c1c; --noteb:#e2a64f; --noteink:#f6e6c9; --shadow:0 8px 26px rgba(0,0,0,.4);
    --r-eu:#b77cbc; --r-me:#e8834a; --r-af:#c9a23a; --r-sa:#de6f88; --r-ca:#8d77c8; --r-ea:#d0654c; --r-se:#5aa699; --r-am:#9f9a48; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#231a21; --panel:#2e232c; --ink:#f7e9dc; --muted:#bea69d; --line:#45343f; --grid:rgba(247,233,220,.07);
    --accent:#f08a4b; --accent-ink:#2a150b; --plum:#b493e0; --plum-ink:#24152f; --soft:#3a2b35; --warn:#ff9a80; --mapland:#4a3a42;
    --note:#3a2c1c; --noteb:#e2a64f; --noteink:#f6e6c9; --shadow:0 8px 26px rgba(0,0,0,.4);
    --r-eu:#b77cbc; --r-me:#e8834a; --r-af:#c9a23a; --r-sa:#de6f88; --r-ca:#8d77c8; --r-ea:#d0654c; --r-se:#5aa699; --r-am:#9f9a48; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fu);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px 4px 16px}
header h1{font-family:var(--fd);font-weight:700;font-size:19px;margin:0;letter-spacing:-.01em}
.hd-r{display:flex;align-items:center;gap:6px}
#st{font-size:11px;color:var(--muted);text-align:right}
.gear{border:0;background:none;width:40px;height:40px;border-radius:50%;font-size:19px;color:var(--muted)}
.gear:active{background:var(--soft)}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.view.on{display:block}
#v-tl.on{display:flex;flex-direction:column;overflow:hidden}
/* Floating tab bar: a rounded pill above the bottom edge, with a short divider between options. */
nav{position:fixed;z-index:30;left:calc(12px + env(safe-area-inset-left));right:calc(80px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.18);overflow:hidden}
nav button{position:relative;border:0;background:none;padding:13px 2px 12px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
nav button+button:before{content:"";position:absolute;left:0;top:30%;height:40%;width:1px;background:var(--line)}
nav button[aria-current="true"]{color:var(--accent);background:var(--soft)}
/* Floating add button, next to the tab bar */
.fab{position:fixed;z-index:31;right:calc(14px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.25)}
body.in-form .fab,body.in-form nav{display:none}
body.in-form .view .pad{padding-bottom:40px}
#scrim{position:fixed;inset:0;background:rgba(10,20,26,.32);z-index:19;display:none}
#scrim.on{display:block}
#addmenu{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.2);padding:8px 16px calc(18px + env(safe-area-inset-bottom));display:none;max-height:86%;overflow:auto;max-width:640px;margin:0 auto}
#addmenu.on{display:block}
.am-t{font-family:var(--fd);font-size:19px}
.am{display:flex;flex-direction:column;gap:2px}
.am button{display:flex;gap:12px;align-items:center;text-align:left;border:0;background:none;padding:10px 4px;border-bottom:1px solid var(--line)}
.am button:last-child{border-bottom:0}
.am-i{flex:none;width:38px;height:38px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:18px}
.am b{display:block;font-size:15px}
.am small{color:var(--muted);font-size:12.5px}
.view .pad{padding-bottom:96px}
.pad{padding:8px 16px 28px;max-width:720px;margin:0 auto}
h2{font-family:var(--fd);font-size:22px;line-height:1.15;margin:4px 0 6px;font-weight:700;text-wrap:balance}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;font-weight:700}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.del{color:var(--warn)}
.btn.sm{padding:7px 11px;font-size:12.5px}
.small{font-size:13px}.tiny{font-size:11.5px}.mt6{margin-top:8px}
.lnkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-align:left;font-size:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
textarea{resize:vertical;min-height:90px}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 4px}
#app{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
/* Peek card: docked above the tab bar when you tap something on the timeline */
#pop{position:absolute;z-index:15;left:10px;right:10px;bottom:calc(74px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--rc,var(--accent));border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:10px 12px 12px}
#pop[hidden]{display:none}
.pk-h{display:flex;justify-content:space-between;align-items:center}
#pop .x{font-size:16px;padding:4px 6px}
#pop .pt{display:block;font-family:var(--fd);font-size:18px;line-height:1.2;margin:6px 0 2px}
#pop p{margin:6px 0 6px;font-size:13px;line-height:1.4}
#pop .row{margin-top:8px}
.pk-ew{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.pk-ew span{border-left:3px solid var(--rc);padding-left:5px;color:var(--ink)}
/* toolbar */
.tb{display:flex;gap:6px;overflow-x:auto;padding:2px 12px 6px;flex:none;scrollbar-width:none}
.tb.flush{padding:8px 0;margin:0 -2px}
#tb .chip,#tb2 .chip{padding:4px 10px;font-size:11.5px}
.fbtn{margin-left:auto}
#tf{padding:4px 12px 8px;border-bottom:1px solid var(--line);flex:none}
#tf[hidden]{display:none}
#tf select{width:auto;max-width:200px;border-radius:999px;padding:4px 10px;font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.lg{display:inline-block;width:22px;height:10px;border-radius:3px;--rc:var(--r-eu)}
.lg.k-state{background:var(--rc)}.lg.k-dyn{background:var(--rc);border-radius:999px}.lg.k-era{background:var(--panel);border:1.5px solid var(--rc)}.lg.k-war{background:var(--rc);opacity:.75}
.lg.ev1{width:10px;height:10px;border-radius:50%;background:var(--rc)}.lg.ev2{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--rc)}
.tb::-webkit-scrollbar{display:none}
.tb .chip,.tb select{flex:none;width:auto}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tb select{border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;max-width:150px}
/* timeline */
#sc{flex:1;min-height:0;overflow:auto;position:relative;border-top:1px solid var(--line);-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
#canvas{position:relative}
#axis{position:sticky;top:0;height:26px;z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
#axis span{position:absolute;top:6px;font-size:10.5px;font-weight:600;color:var(--muted);transform:translateX(-50%);white-space:nowrap;font-variant-numeric:tabular-nums}
#lanes{position:relative}
.lane{position:relative;border-top:1px solid var(--line)}
.lname{position:sticky;left:0;z-index:4;width:74px;height:100%;background:var(--bg);border-right:1px solid var(--line);border-left:4px solid var(--rc);padding:6px 4px 0 6px;font-size:10.5px;font-weight:700;line-height:1.15;color:var(--ink)}
.bar{position:absolute;height:var(--bh,22px);border-radius:5px;background:var(--rc);color:#fff;font-size:var(--bf,11px);font-weight:600;line-height:var(--bh,22px);padding:0 6px;white-space:nowrap;overflow:clip;opacity:.92;cursor:pointer;border:0;text-align:left}
.bar span{position:sticky;left:80px}
/* Kinds of span: states solid, dynasties as pills, eras outlined, wars marked ⚔ and slightly lighter */
.bar.k-dyn{border-radius:999px;padding:0 9px}
.bar.k-era{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--rc);border-left:4px solid var(--rc);opacity:1}
.bar.k-war{opacity:.78}
.bar.out{overflow:visible;padding:0}
.bar.out span{position:absolute;left:calc(100% + 4px);top:0;color:var(--ink);font-weight:600;background:var(--bg);border-radius:4px;padding:0 4px;box-shadow:0 0 0 1px var(--grid)}
.chip.rg[aria-pressed="true"]{background:var(--rc);border-color:var(--rc);color:#fff}
#tb2{padding-top:0}
#canvas{padding-bottom:84px}
.ev{position:absolute;height:18px;display:flex;align-items:center;gap:4px;cursor:pointer;font-size:11px;font-weight:600;white-space:nowrap;border:0;background:none;padding:0;z-index:2}
.ev i{flex:none;width:12px;height:12px;border-radius:50%;background:var(--rc);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--rc)}
.ev b{color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 4px;line-height:16px}
.ev.dot b{display:none}
.ev.t2 i{width:8px;height:8px;margin:0 2px;background:var(--panel);border:1.5px solid var(--rc);box-shadow:none}
.read-2 i{background:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.sel{outline:2px solid var(--ink);outline-offset:1px;z-index:3}
.lnk{outline:2px dashed var(--accent);outline-offset:1px;z-index:3}
.today{position:absolute;top:0;bottom:0;width:1px;background:var(--warn);opacity:.55;pointer-events:none;z-index:2}
#lk{position:absolute;left:0;top:0;pointer-events:none;z-index:3;overflow:visible}
#lk path{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:4 3}
.hint{padding:0 16px 6px;font-size:11.5px;color:var(--muted)}
/* sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:90%;overflow:auto;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.18);border-radius:16px 16px 0 0;padding:6px 16px calc(96px + env(safe-area-inset-bottom));z-index:20;display:none;max-width:720px;margin:0 auto;overscroll-behavior:contain}
.sh-grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 6px}
.crumb{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:2px 0 6px;display:block}
.about{margin:10px 0;padding:0 0 0 2px}
.about p{margin:4px 0}
.lbl{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:2px}
.why-mine{margin:10px 0;padding:10px 12px;background:var(--note);color:var(--noteink);border-radius:10px;font-size:14.5px}
.why-mine .lbl{color:var(--noteb)}
/* Your notes look like a notebook page, so they never blur with the atlas's own text */
.note{margin:14px 0 4px;background:var(--note);border-radius:12px;padding:8px 10px 10px;border-left:4px solid var(--noteb)}
.note-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:700;color:var(--noteb);margin-bottom:4px}
.note-st{font-weight:600;color:var(--muted);font-size:11px}
.note textarea{background:transparent;border:0;padding:4px 2px;min-height:96px;color:var(--noteink);font-size:15px;line-height:1.45}
.note textarea:focus{outline:none}
.note:focus-within{box-shadow:0 0 0 2px var(--noteb)}
.st3{display:flex;width:100%;margin:10px 0 4px}
.st3 button{flex:1;padding:8px 4px;font-size:12.5px}
.qadd{flex-wrap:nowrap;margin-top:8px}
.lkbox{background:var(--bg);border-radius:10px;padding:8px}
.lk-o{font-size:13px;font-weight:600;color:var(--ink);text-align:left;padding:0}
.sh-edit{margin-top:20px;padding-top:12px;border-top:1px solid var(--line)}
.ew{display:flex;flex-direction:column;gap:6px}
.ew-r{display:flex;gap:10px;font-size:13px;border-left:4px solid var(--rc);padding:2px 0 2px 8px}
.ew-n{flex:none;width:86px;font-weight:700;font-size:11.5px;color:var(--muted);padding-top:1px}
#sheet.on{display:block}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-left:4px solid var(--rc);padding:2px 8px;background:var(--soft);border-radius:4px}
.yr{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;font-size:13px}
.why{margin:8px 0}
.who{margin:6px 0;font-size:14px}
.lk-chips{display:flex;flex-wrap:wrap;gap:6px}
.lk-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-left:3px solid var(--rc,var(--line));background:var(--bg);border-radius:8px;padding:6px 9px;font-size:12.5px;font-weight:600;text-align:left;max-width:100%}
.lk-chip small{color:var(--muted);font-weight:500}
.x{border:0;background:none;color:var(--muted);font-size:15px;padding:0 2px}
.pill{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:var(--soft);border-radius:999px;padding:1px 8px;vertical-align:1px}
.wpinfo{font-size:13px;margin:4px 0 8px;padding:8px 10px;background:var(--soft);border-radius:8px}
#wpchips .lk-chips{margin-bottom:8px}
#wpchips .lk-chips:empty{display:none}
button.lk-chip small{margin-left:2px}
.res{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.res button{text-align:left;border:0;background:var(--panel);padding:9px 10px;border-radius:8px;font-size:13.5px}
/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li .fl{font-size:22px;line-height:1}
.li .t{font-weight:600}
.li .t.done{text-decoration:line-through;color:var(--muted)}
.lit{min-width:0;flex:1}
.hasnote{color:var(--noteb);font-weight:600}
.snip{font-style:italic}
.li .s{font-size:12.5px;color:var(--muted)}
.li .y{flex:none;width:52px;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--muted)}
.rs{flex:none;border:0;background:none;font-size:21px;line-height:1;color:var(--accent);padding:2px 4px;min-width:30px;min-height:30px}
.rgn{display:flex;align-items:center;gap:8px;margin:20px 0 6px;font-family:var(--fd);font-weight:700;font-size:17px}
.rgn:before{content:"";width:10px;height:10px;border-radius:2px;background:var(--rc)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cc{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 10px;text-align:left;display:flex;gap:8px;align-items:center}
.cc .fl{font-size:22px}
.cc b{font-size:13px;display:block;line-height:1.2}
.cc small{color:var(--muted);font-size:11px}
.ccb{min-width:0;flex:1}
.mprog{display:block;height:4px;border-radius:2px;background:var(--soft);margin:4px 0 2px;overflow:hidden}
.mprog i{display:block;height:100%;background:var(--accent)}
/* Library */
.dash{display:flex;flex-direction:column;gap:10px;margin:10px 0 14px}
.dash-c{display:flex;flex-direction:column;gap:6px}
.dcard{display:flex;gap:8px;align-items:baseline;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 11px}
.dcard b{flex:1;font-weight:600}
.dcard small{color:var(--muted)}
.duebtn{border:0;background:var(--soft);border-radius:10px;padding:10px 12px;text-align:left;font-weight:600;color:var(--accent)}
.lseg{display:flex;width:100%;margin:4px 0 10px}
.lseg button{flex:1;padding:9px 4px}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stats b{display:block;font-family:var(--fd);font-size:24px}
.stats span{font-size:11.5px;color:var(--muted);font-weight:600}
.prof{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin:10px 0}
.prof dt{color:var(--muted);font-weight:700;font-size:12px;padding-top:2px}
.prof dd{margin:0}
.bigflag{font-size:46px;line-height:1}
.bar-prog{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:6px 0 2px}
.bar-prog i{display:block;height:100%;background:var(--accent)}
.map{height:190px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--soft);position:relative}
.map svg{display:block;width:100%;height:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 12px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
/* revise */
.card{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:18px 16px;min-height:200px;margin:12px 0}
.card .q{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card .big{font-family:var(--fd);font-size:24px;font-weight:700;line-height:1.2;margin:8px 0}
.card .ans{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.card .ans b{font-family:var(--fd);font-size:20px}
.mynote{background:var(--note);color:var(--noteink);border-left:4px solid var(--noteb);border-radius:8px;padding:8px 10px;margin-top:10px;font-size:13.5px;white-space:pre-wrap}
.mynote .lbl{color:var(--noteb)}
.err{color:var(--warn);font-size:13px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));white-space:nowrap;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;z-index:50}
/* ---------- 70s layer: soft curves, warm pastels, more breathing room ---------- */
h1,h2,.am-t,.stats b,.card .big,#pop .pt,.rgn,.tile b{font-variation-settings:"SOFT" 100}
header h1{display:flex;align-items:center;gap:10px;font-size:20px;color:var(--ink)}
.mark{display:inline-block;width:28px;height:14px;border-radius:28px 28px 0 0;background:radial-gradient(circle at 50% 100%,var(--plum) 0 34%,transparent 34% 42%,#e6a63a 42% 64%,transparent 64% 72%,var(--accent) 72% 100%);margin-top:2px}
.mark i{display:none}
h2{font-size:26px;letter-spacing:-.01em}
h3{color:var(--plum);letter-spacing:.1em;font-size:11.5px;margin:22px 0 10px}
.btn{border-radius:999px;padding:9px 15px;background:var(--panel);border-color:var(--line)}
.btn.sm{padding:7px 13px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip{border-radius:999px;background:var(--panel);border-color:var(--line);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:var(--plum-ink)}
.chip.rg[aria-pressed="true"]{background:var(--rc);border-color:var(--rc);color:#fff}
input[type=text],input[type=number],input[type=search],select,textarea{border-radius:14px;background:var(--panel);border-color:var(--line)}
.seg{border-radius:999px;border-color:var(--line);background:var(--panel)}
.seg button{background:transparent;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--plum);color:var(--plum-ink);border-radius:999px}
.tag{border-radius:999px;border-left:0;padding:3px 11px 3px 9px;background:var(--soft);box-shadow:inset 4px 0 0 var(--rc)}
.lk-chip{border-radius:999px;border-left-width:1px;box-shadow:inset 3px 0 0 var(--rc,transparent);padding:7px 12px}
.card,.qcard,.stats div,.dcard,#pop,.cc{border-radius:20px}
.card{box-shadow:var(--shadow);border:0}
.qcard{border:0;box-shadow:var(--shadow)}
nav{border-radius:999px;border:0;box-shadow:var(--shadow);background:var(--panel)}
nav button{padding:14px 2px}
nav button[aria-current="true"]{background:var(--soft);color:var(--accent);border-radius:999px}
nav button+button:before{background:var(--line)}
.fab{background:linear-gradient(135deg,var(--accent),#e8934a);box-shadow:0 8px 22px rgba(217,104,47,.38)}
#sheet,#addmenu{border-radius:26px 26px 0 0;background:var(--panel);border:0}
.am-i{border-radius:14px;background:var(--soft)}
.note{border-radius:18px;border-left-width:5px}
.why-mine{border-radius:16px}
.toast{background:var(--plum);color:var(--plum-ink)}
.rs{color:var(--plum)}
.pill{background:var(--soft);color:var(--accent);border-radius:999px}
.duebtn{border-radius:999px;background:var(--soft);color:var(--plum);padding:11px 16px}
.lnkbtn{color:var(--accent)}
.bar-prog,.mprog{background:var(--soft);border-radius:999px}
.bar-prog i,.mprog i{background:linear-gradient(90deg,var(--accent),#e6a63a);border-radius:999px}
.li{padding:12px 0;border-bottom-color:var(--line)}
.ew-r{border-left-width:4px;border-radius:2px}
/* timeline: one compact control row + regions, softer lanes and bars */
#tb{display:flex;align-items:center;gap:6px;padding:2px 10px 6px 12px;overflow:visible}
.tbs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tbs::-webkit-scrollbar{display:none}
.tbs .chip{flex:none}
.tbfix{display:flex;gap:5px;flex:none;align-items:center}
.zb{width:32px;height:30px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:17px;font-weight:600;line-height:1;color:var(--ink);padding:0}
.fbtn{margin-left:0;padding:4px 10px}
.fbtn.on{background:var(--plum);color:var(--plum-ink);border-color:var(--plum)}
#tb2{padding:0 12px 8px}
#tf{border-bottom:0;background:var(--soft);margin:0 10px 8px;border-radius:18px;padding:10px 12px}
#sc{border-top:0}
#axis{background:var(--bg);border-bottom:1px solid var(--line)}
.lane{border-top:0;margin-top:4px}
.lane+.lane{border-top:1px dashed var(--line)}
.lname{background:var(--bg);border-right:0;border-left:0;padding:8px 6px 0 14px;font-size:11px;font-weight:700;color:var(--muted)}
.lname:before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:4px;border-radius:4px;background:var(--rc);opacity:.8}
.bar{border-radius:999px;padding:0 10px;opacity:.9}
.bar.k-era{border-left:0;box-shadow:inset 0 0 0 1.5px var(--rc);background:var(--panel)}
.bar.out{padding:0}
.bar.out span{border-radius:999px;padding:0 7px}
.ev i{border-color:var(--bg)}
.today{background:var(--accent)}
#lk path{stroke:var(--plum)}
.sel{outline-color:var(--plum)}
.lnk{outline-color:var(--accent)}
#pop{border-left:0;box-shadow:var(--shadow),inset 5px 0 0 var(--rc,var(--accent))}
/* countries */
.cohead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.cohead select{width:auto;max-width:56%;border-radius:999px;padding:8px 12px;font-weight:600;font-size:13px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;overflow:hidden;text-align:left;border:0;border-radius:22px;padding:16px 14px 14px;min-height:104px;background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px;justify-content:flex-end}
.tile:before{content:"";position:absolute;right:-26px;top:-26px;width:86px;height:86px;border-radius:50%;background:var(--rc);opacity:.22}
.tile:after{content:"";position:absolute;right:16px;top:16px;width:14px;height:14px;border-radius:50%;background:var(--rc)}
.tile b{font-family:var(--fd);font-size:17px;line-height:1.15;color:var(--ink);font-weight:700}
.tile small{color:var(--muted);font-size:12px}
.rhead{display:flex;align-items:center;gap:10px;margin:14px 0 2px}
.rhead b{font-family:var(--fd);font-size:20px;font-variation-settings:"SOFT" 100;display:flex;align-items:center;gap:8px}
.rhead b:before{content:"";width:12px;height:12px;border-radius:50%;background:var(--rc)}
.clist{display:flex;flex-direction:column;background:var(--panel);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.crow{display:flex;align-items:center;gap:12px;border:0;background:none;padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow .fl{font-size:22px;line-height:1}
.crn{flex:1;font-weight:600}
.crp{display:flex;align-items:center;gap:6px;width:88px}
.crp .mprog{flex:1;margin:0}
.crp small{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.cc{border:0;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){#sheet.on,#addmenu.on{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.4}}}
@media (orientation:landscape) and (max-height:520px){
  header{padding:4px 14px 2px} header h1{font-size:16px}
  nav button{padding:7px 2px 6px;font-size:11px}
  nav{bottom:calc(6px + env(safe-area-inset-bottom));max-width:420px}
  .fab{width:46px;height:46px;font-size:26px;bottom:calc(6px + env(safe-area-inset-bottom))}
  #pop{bottom:calc(56px + env(safe-area-inset-bottom))}
  .tb{padding:2px 14px 4px}
  .pad{max-width:none}
  #sheet{left:auto;right:0;width:min(52%,460px);top:0;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.15);margin:0}
}
</style>
</head>
<body>
<div id="app">
  <header><h1><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Timeline Atlas</h1><div class="hd-r"><span id="st"></span><button class="gear" data-act="settings" aria-label="Settings, backup and restore">⚙︎</button></div></header>
  <main>
    <section id="v-tl" class="view on" aria-label="Timeline">
      <div class="tb" id="tb" aria-label="Periods"></div>
      <div id="tf" hidden></div>
      <div class="tb" id="tb2" aria-label="Regions"></div>
      <div id="pop" hidden></div>
      <div id="sc"><div id="canvas"><div id="axis"></div><div id="lanes"></div></div></div>
    </section>
    <section id="v-co" class="view" aria-label="Countries"></section>
    <section id="v-pp" class="view" aria-label="Library"></section>
    <section id="v-rv" class="view" aria-label="Review"></section>
    <section id="v-ad" class="view" aria-label="Add"></section>
    <section id="v-set" class="view" aria-label="Settings"></section>
  </main>
  <div id="scrim"></div>
  <div id="sheet" role="dialog" aria-label="Details"></div>
  <div id="addmenu" role="dialog" aria-label="Add"></div>
  <nav id="nav">
    <button data-tab="tl" aria-current="true">Timeline</button>
    <button data-tab="co">Countries</button>
    <button data-tab="pp">Library</button>
    <button data-tab="rv">Review</button>
  </nav>
  <button class="fab" data-act="fab" aria-label="Add something">＋</button>
</div>
<script src="data-world.js"></script>
<script src="data-areas.js"></script>
<script src="data-history.js"></script>
<script src="data-history-2.js"></script>
<script src="data-history-3.js"></script>
<script src="data-history-4.js"></script>
<script src="seed-build.js"></script>
<script src="app.js"></script>
<script>if("serviceWorker" in navigator&&location.protocol==="https:"){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
</html>
